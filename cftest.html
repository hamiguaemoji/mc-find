<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloudflare 连通性测试</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0b0f15;color:#e8eef6;font:16px/1.7 -apple-system,"PingFang SC","Noto Sans SC",sans-serif;
       padding:26px 18px 50px;max-width:620px;margin:0 auto}
  h1{font-size:20px;margin-bottom:6px}
  .sub{color:#8c99aa;font-size:13px;margin-bottom:22px}
  .row{background:#151c26;border:1px solid #232c39;border-radius:14px;padding:14px 16px;margin-bottom:10px;
       display:flex;align-items:center;justify-content:space-between;gap:12px}
  .row .n{font-size:14.5px}
  .row .d{font-size:11.5px;color:#8c99aa;margin-top:2px}
  .st{font-size:13px;font-weight:600;white-space:nowrap}
  .wait{color:#8c99aa}
  .ok{color:#34d399}
  .bad{color:#f87171}
  .mid{color:#fbbf24}
  .verdict{margin-top:22px;background:#151c26;border:1px solid #232c39;border-radius:14px;padding:16px;
           font-size:14px;line-height:1.9}
  .verdict b{color:#60a5fa}
  button{margin-top:18px;width:100%;padding:14px;border-radius:13px;border:0;background:#3b82f6;color:#fff;
         font-size:15px;font-weight:600}
</style>
</head>
<body>
<h1>Cloudflare 连通性测试</h1>
<div class="sub">测你这台手机的网络能不能连上 Cloudflare 的免费后端，决定后面走哪条路</div>

<div id="list"></div>
<div class="verdict" id="verdict">正在测试…</div>
<button onclick="location.reload()">重新测一次</button>

<script>
const TARGETS = [
  {n:"GitHub（基线）", d:"api.github.com · 已知能连，作为参照", u:"https://api.github.com/rate_limit", cors:true, key:"base"},
  {n:"Cloudflare 边缘", d:"cloudflare.com/cdn-cgi/trace · 能不能到 CF 节点", u:"https://www.cloudflare.com/cdn-cgi/trace", cors:false, key:"cfedge"},
  {n:"Cloudflare DNS 接口", d:"cloudflare-dns.com · 可读响应，判断是否真通", u:"https://cloudflare-dns.com/dns-query?name=example.com&type=A", cors:true, key:"cfdns"},
  {n:"Workers 域名", d:"workers.dev · 免费后端就挂在这个域名下", u:"https://workers.dev/", cors:false, key:"workers"},
  {n:"Vercel", d:"vercel.app · 备选托管", u:"https://vercel.com/", cors:false, key:"vercel"}
];

const TIMEOUT = 6000;
const list = document.getElementById("list");
const results = {};

function mkRow(t){
  const div = document.createElement("div");
  div.className = "row";
  div.innerHTML = '<div><div class="n">'+t.n+'</div><div class="d">'+t.d+'</div></div>'
                + '<div class="st wait" id="st-'+t.key+'">等待</div>';
  list.appendChild(div);
}

async function testOne(t){
  const st = document.getElementById("st-"+t.key);
  st.textContent = "测试中…";
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), TIMEOUT);
  const t0 = performance.now();
  try{
    await fetch(t.u + (t.u.includes("?") ? "&" : "?") + "_t=" + Date.now(), {
      mode: t.cors ? "cors" : "no-cors",
      cache: "no-store",
      signal: ctrl.signal
    });
    const ms = Math.round(performance.now() - t0);
    clearTimeout(timer);
    st.textContent = ms + " ms";
    st.className = "st " + (ms < 1500 ? "ok" : ms < 3500 ? "mid" : "bad");
    results[t.key] = {ms, ok:true};
  }catch(e){
    clearTimeout(timer);
    st.textContent = (e.name === "AbortError") ? "超时" : "失败";
    st.className = "st bad";
    results[t.key] = {ms: Math.round(performance.now() - t0), ok:false};
  }
}

(async ()=>{
  TARGETS.forEach(mkRow);
  await Promise.all(TARGETS.map(testOne));

  const base = results.base, edge = results.cfedge, dns = results.cfdns, wk = results.workers;
  let html = "";
  if(!base || !base.ok){
    html = "连 <b>GitHub</b> 都超时了，这个网络本身有问题。换 WiFi 或流量再测一次。";
  }else if(wk && wk.ok && wk.ms < 3000 && edge && edge.ok){
    html = "✅ <b>Cloudflare 这条路在你这儿通</b>：Workers 域名 " + wk.ms + " ms、CF 边缘 " + edge.ms
         + " ms（基线 " + base.ms + " ms）。可以做真提交 + 真审核，列表继续用 mc-find.de5.net。";
  }else if(dns && dns.ok && dns.ms < 3000){
    html = "⚠️ CF 边缘能连（" + dns.ms + " ms），但 <b>workers.dev 这条域名打不开</b>。"
         + "这种情况要给自己绑个自有域名走 Cloudflare 代理才能用，比原计划多一步。";
  }else{
    html = "❌ <b>Cloudflare 在你这儿基本连不上</b>（基线 " + base.ms + " ms）。"
         + "免费后端走这条路会天天出问题，建议改用 Vela 那种国内能直连的方案。";
  }
  html += "<br><br><span style='color:#8c99aa;font-size:12.5px'>截图发我，我按结果定下一步。</span>";
  document.getElementById("verdict").innerHTML = html;
})();
</script>
</body>
</html>
